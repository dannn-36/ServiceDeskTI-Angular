<!-- Hogar limpio -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiceDesk TI - Iniciar Sesión</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .glass-effect {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .slide-in {
      animation: slideIn 0.4s ease-out;
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .input-focus:focus {
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }

    .btn-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <!-- Elementos decorativos de fondo -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-32 h-32 bg-white opacity-10 rounded-full floating"></div>
    <div class="absolute top-40 right-32 w-20 h-20 bg-white opacity-5 rounded-full floating" style="animation-delay: -2s;"></div>
    <div class="absolute bottom-32 left-1/4 w-24 h-24 bg-white opacity-10 rounded-full floating" style="animation-delay: -4s;"></div>
    <div class="absolute bottom-20 right-20 w-16 h-16 bg-white opacity-5 rounded-full floating" style="animation-delay: -1s;"></div>
  </div>

  <div class="w-full max-w-md mx-auto mt-20">
    <!-- Logo y título -->
    <div class="text-center mb-8 fade-in">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-lg mb-4">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-lg">IT</span>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">ServiceDesk TI</h1>
      <p class="text-blue-100">Sistema de Gestión de Soporte Técnico</p>
    </div>

    <!-- Formulario de login Angular -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 fade-in" style="animation-delay: 0.2s;">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Iniciar Sesión</h2>
      </div>
      <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-6">
        <!-- Email -->
        <div class="slide-in" style="animation-delay: 0.4s;">
          <label for="correoUsuario" class="block text-sm font-medium text-gray-700 mb-2">
            Correo electrónico
          </label>
          <div class="relative">
            <input type="email" id="correoUsuario" name="correoUsuario" [(ngModel)]="correoUsuario" required
                   class="input-focus w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                   placeholder="usuario@empresa.com" autocomplete="username">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="text-gray-400">📧</span>
            </div>
          </div>
        </div>
        <!-- Contraseña -->
        <div class="slide-in" style="animation-delay: 0.5s;">
          <label for="contrasenaUsuario" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input type="password" id="contrasenaUsuario" name="contrasenaUsuario" [(ngModel)]="contrasenaUsuario" required
                   class="input-focus w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                   placeholder="••••••••" autocomplete="current-password">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="text-gray-400">🔒</span>
            </div>
          </div>
        </div>
        <!-- Mensaje de error -->
        <div *ngIf="loginError" class="text-red-600 text-center">{{loginError}}</div>
        <!-- Botón de login -->
        <button type="submit" [disabled]="enviando || !loginForm.valid" class="btn-hover w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-medium py-3 px-4 rounded-lg transition-all slide-in" style="animation-delay: 0.7s;">
          <span class="flex items-center justify-center space-x-2">
            <span>🚀</span>
            <span>{{ enviando ? 'Verificando...' : 'Iniciar Sesión' }}</span>
          </span>
        </button>
      </form>
    </div>
    <!-- Footer -->
    <div class="text-center mt-8 text-blue-100 text-sm fade-in" style="animation-delay: 1s;">
      <p>© 2025 ServiceDesk TI. Desarrollado por HIVE. Todos los derechos reservados.</p>
      <p class="mt-1">Versión 2.1.0 | <a href="#" class="hover:text-white transition-colors">Soporte Técnico</a></p>
    </div>
  </div>
</body>
</html>
